name: quarto

on: push

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbclient ipykernel matplotlib open-atmos-jupyter-utils PyMPDATA
          python -m ipykernel install --user --name global_python --display-name "Python (global_python)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render notebook
        run: quarto render lab1.ipynb --to pdf --execute

      - uses: actions/upload-artifact@v4
        with:
          name: lab1-pdf
          path: lab1.pdf
